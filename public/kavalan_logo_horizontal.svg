<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="neonRimH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="kCoreGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem Group (scaled & positioned at x=8, y=4) -->
  <g transform="translate(4, 2) scale(0.48)">
    <!-- Ambient Underglow -->
    <path d="M 60 10 L 102 24 L 92 78 L 60 110 L 28 78 L 18 24 Z" 
          fill="none" stroke="#0284c7" stroke-width="7" opacity="0.45" filter="url(#glowH)" />

    <!-- Outer Cyber Armor Shield -->
    <path d="M 60 10 L 102 24 L 92 78 L 60 110 L 28 78 L 18 24 Z" 
          fill="url(#shieldGradH)" stroke="url(#neonRimH)" stroke-width="3" stroke-linejoin="round" />

    <!-- Left Spine of 'K' -->
    <path d="M 40 32 L 49 32 L 49 88 L 40 88 Z" fill="url(#kCoreGradH)" rx="2"/>

    <!-- Top Wing of 'K' -->
    <path d="M 52 56 L 73 34 L 84 34 L 62 59 Z" fill="#60a5fa" rx="2"/>

    <!-- Bottom Wing of 'K' -->
    <path d="M 54 62 L 74 88 L 86 88 L 64 61 Z" fill="url(#kCoreGradH)" rx="2"/>

    <!-- Central Nexus Diamond -->
    <polygon points="56,60 62,54 68,60 62,66" fill="#ffffff" filter="url(#glowH)"/>

    <!-- Top Node -->
    <circle cx="60" cy="19" r="3" fill="#38bdf8" filter="url(#glowH)"/>
  </g>

  <!-- Text & Typography Lockup -->
  <!-- Brand Name -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="23" font-weight="800" letter-spacing="1.2" fill="url(#textGrad)">KAVALAN</text>

  <!-- SIEM SOAR Badge -->
  <rect x="194" y="15" width="86" height="20" rx="4" fill="rgba(37, 99, 235, 0.16)" stroke="#2563eb" stroke-width="1.2"/>
  <text x="237" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#38bdf8" text-anchor="middle">SIEM / SOAR</text>

  <!-- Subtitle Tagline -->
  <text x="69" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10" font-weight="600" letter-spacing="0.6" fill="#94a3b8">DISTRIBUTED AUTONOMOUS SOC</text>

  <!-- Status Pulse Dot -->
  <circle cx="258" cy="46" r="3" fill="#10b981" filter="url(#glowH)"/>
  <text x="266" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="9.5" font-weight="600" fill="#10b981">ONLINE</text>
</svg>