<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Cyber Shield Outer Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Core 'K' Vibrant Gradient -->
    <linearGradient id="kCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Secondary Wing Gradient -->
    <linearGradient id="kWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Underglow -->
  <path d="M 60 10 L 102 24 L 92 78 L 60 110 L 28 78 L 18 24 Z" 
        fill="none" stroke="#0284c7" stroke-width="6" opacity="0.4" filter="url(#softGlow)" />

  <!-- Outer Cyber Armor Shield -->
  <path d="M 60 10 L 102 24 L 92 78 L 60 110 L 28 78 L 18 24 Z" 
        fill="url(#shieldGrad)" stroke="url(#neonRim)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner High-Tech Facet Lines -->
  <path d="M 60 14 L 60 106" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M 24 28 L 60 58 L 96 28" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

  <!-- Left Spine of the 'K' (Sentinel Bastion Pillar) -->
  <path d="M 40 32 L 49 32 L 49 88 L 40 88 Z" 
        fill="url(#kCoreGrad)" rx="2"/>

  <!-- Top Right Wing of 'K' (Upward Attack Interceptor) -->
  <path d="M 52 56 L 73 34 L 84 34 L 62 59 Z" 
        fill="url(#kWingGrad)" rx="2"/>

  <!-- Bottom Right Wing of 'K' (Ground Anchor / SOAR Stabilizer) -->
  <path d="M 54 62 L 74 88 L 86 88 L 64 61 Z" 
        fill="url(#kCoreGrad)" rx="2"/>

  <!-- Central Nexus AI Node / Pulse Core -->
  <polygon points="56,60 62,54 68,60 62,66" 
           fill="#ffffff" filter="url(#cyberGlow)"/>

  <!-- Top Sentinel Radar Nodes -->
  <circle cx="60" cy="19" r="2.5" fill="#38bdf8" filter="url(#cyberGlow)"/>
  <circle cx="28" cy="78" r="1.8" fill="#3b82f6"/>
  <circle cx="92" cy="78" r="1.8" fill="#3b82f6"/>
</svg>