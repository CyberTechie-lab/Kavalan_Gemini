# Kavalan — Metasploitable vulnerable-target lab
#
# Metasploitable 2 is a deliberately vulnerable Linux box: real services (Apache,
# OpenSSH, MySQL, FTP, Samba...) with real weaknesses. We use it as the target so the
# attack traffic is realistic, and collect its web + SSH logs for Kavalan to read.
#
# SAFETY: this box is intentionally insecure. Both ports bind to 127.0.0.1 ONLY, so it is
# reachable only from this machine. NEVER map it to 0.0.0.0 or expose it to a network/internet.

services:
  metasploitable:
    image: tleemcjr/metasploitable2
    container_name: kavalan-msf
    # The image self-starts its vulnerable services. If it exits immediately, see the
    # README "If the container won't stay up" note.
    ports:
      - "127.0.0.1:2222:22"     # SSH   — brute-force target (login attempts land in auth.log)
      - "127.0.0.1:8080:80"     # HTTP  — web target (requests land in apache access.log)
    restart: unless-stopped
