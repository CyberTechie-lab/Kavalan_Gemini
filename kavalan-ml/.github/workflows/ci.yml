name: Kavalan CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and detection-quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint (non-blocking style check)
        run: ruff check . || true
      - name: Run detection-quality tests
        run: pytest -q

  model:
    name: Rebuild dataset and retrain model
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build dataset and train
        run: |
          bash scripts/fetch_data.sh
          python build_dataset.py
          python train.py
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: tactic-model
          path: |
            model/tactic_model.joblib
            model/report.txt

  release:
    name: Package standalone release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Build the offline bundle
        run: |
          mkdir -p dist/kavalan
          cp detector.py kavalan_monitor.py dashboard.html README.md dist/kavalan/ 2>/dev/null || true
          cp -r model dist/kavalan/ 2>/dev/null || true
          (cd dist && zip -r kavalan-${GITHUB_REF_NAME}.zip kavalan)
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kavalan-*.zip
