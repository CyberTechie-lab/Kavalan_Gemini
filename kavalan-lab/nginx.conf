# nginx for the Kavalan lab.
# Reverse-proxies Juice Shop and writes a combined-format access log that
# detector.py can read directly. The log goes to ./logs/access.log on your laptop.

events {}

http {
    log_format combined_ua '$remote_addr - - [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/lab/access.log combined_ua;
    error_log  /var/log/lab/error.log warn;

    # Don't let proxy buffering reorder timestamps.
    proxy_buffering off;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass         http://juice-shop:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            # keep the real client IP in the log even though traffic is proxied
            proxy_set_header   X-Forwarded-For $remote_addr;
        }
    }
}
