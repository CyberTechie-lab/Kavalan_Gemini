# Kavalan lab (parallel edition): Juice Shop behind nginx, plus two built-in
# traffic sources so you can run normal users, a human attacker, and the AI agent
# at the same time and watch Kavalan tell them apart.
#
#   normal-users    benign browsing, from its own container IP
#   human-attacker  slow, hand-paced probing, from its own container IP
#   (AI agent)      run Strix from your Mac; it arrives as the gateway IP
#
# Each in-network source gets a distinct IP, so the dashboard shows them as
# separate sources. Logs land in ./logs on your laptop.

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: lab-juice-shop
    networks: [backend]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: lab-nginx
    depends_on: [juice-shop]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/lab
    networks: [frontend, backend]
    restart: unless-stopped

  # Benign users. Start/stop with the 'traffic' profile so they only run when you want.
  normal-users:
    image: python:3.12-slim
    container_name: lab-normal-users
    depends_on: [nginx]
    volumes:
      - ./normal_traffic.py:/app/normal_traffic.py:ro
    command: ["python3", "/app/normal_traffic.py", "--base", "http://nginx", "--minutes", "20", "--shoppers", "6"]
    networks: [frontend]
    profiles: ["traffic"]
    restart: "no"

  # A human attacker: slow, deliberate, hand-paced.
  human-attacker:
    image: python:3.12-slim
    container_name: lab-human-attacker
    depends_on: [nginx]
    volumes:
      - ./human_attack.py:/app/human_attack.py:ro
    command: ["python3", "/app/human_attack.py", "--base", "http://nginx", "--minutes", "15"]
    networks: [frontend]
    profiles: ["traffic"]
    restart: "no"

  # A scripted scanner: one tool, machine speed, one noisy source.
  script-attacker:
    image: python:3.12-slim
    container_name: lab-script-attacker
    depends_on: [nginx]
    volumes:
      - ./script_attack.py:/app/script_attack.py:ro
    command: ["python3", "/app/script_attack.py", "--base", "http://nginx", "--minutes", "5", "--rate", "12"]
    networks: [frontend]
    profiles: ["traffic"]
    restart: "no"

networks:
  frontend: {}
  backend:
    internal: true
