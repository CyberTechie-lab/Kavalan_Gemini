{
  "manager": "http://127.0.0.1:8910",
  "agent_name": "ubuntu-srv-01",
  "heartbeat_interval": 10,
  "batch_size": 50,
  "max_eps": 500,
  "syscheck": {
    "directories": ["/etc", "/bin", "/var/www"],
    "interval_seconds": 60
  },
  "localfiles": [
    {
      "format": "web",
      "location": "kavalan-ml/access.log"
    },
    {
      "format": "auth",
      "location": "kavalan-ml/auth.log"
    }
  ]
}
